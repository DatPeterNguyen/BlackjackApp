# Builds the iOS target on a macOS GitHub-hosted runner, since MAUI iOS
# builds require Xcode and can't happen on the Windows dev machine this
# project otherwise lives on. No Apple Developer account yet, so this
# builds unsigned, for the iOS Simulator only - not something you can
# install on a physical device or submit to TestFlight/the App Store.
# Once you enroll in the Apple Developer Program, this can be extended
# with a signing certificate/provisioning profile to produce a real
# device build (see the comment at the bottom of this file).
name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'BlackjackApp.Maui/**'
      - 'BlackjackApp.core/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BlackjackApp.Maui/**'
      - 'BlackjackApp.core/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch: {}

jobs:
  build-ios-simulator:
    # macOS runners are the only GitHub-hosted option with Xcode, and cost
    # 10x the CI minutes of a Linux runner - the path filters above keep
    # this from firing on every unrelated commit.
    #
    # This project's .NET for iOS workload (26.5.10318) needs EXACTLY
    # Xcode 26.6 - not "at least", older or newer both fail the same way,
    # and Microsoft doesn't provide an MSBuild property to relax that
    # check (see https://aka.ms/xcode-requirement). xcode-27 only bundles
    # Xcode 27.0 beta, which is too new; macos-26 bundles Xcode 26.6
    # directly (as its default, in fact) alongside several older ones, so
    # that's the one to use. If a future dotnet workload update bumps the
    # required Xcode version, the "Select Xcode 26.6" step below is the
    # one to update alongside it.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        # Exact version, not "latest" - see the runs-on comment above for
        # why. Fails loudly and lists what IS on the runner if 26.6 isn't
        # there, rather than silently falling back to some other version
        # that would just fail later with a more confusing MSBuild error.
        run: |
          REQUIRED_XCODE="/Applications/Xcode_26.6.app"
          if [ ! -d "$REQUIRED_XCODE" ]; then
            echo "::error::$REQUIRED_XCODE not found on this runner. Available Xcode installs:" >&2
            ls -d /Applications/Xcode*.app 2>/dev/null >&2
            exit 1
          fi
          sudo xcode-select -s "$REQUIRED_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore MAUI workloads
        run: dotnet workload restore BlackjackApp.Maui/BlackjackApp.Maui.csproj

      - name: Restore NuGet dependencies
        # dotnet restore has no -f/--framework shorthand the way build/test
        # do - passing one gets parsed as a second project path instead
        # ("Only one project can be specified"). Restoring without it just
        # restores every applicable TargetFramework for this OS (android,
        # ios, maccatalyst on a Mac runner), which is what the already-run
        # workload restore installed workloads for anyway.
        run: dotnet restore BlackjackApp.Maui/BlackjackApp.Maui.csproj

      - name: Report the resolved MAUI version
        # Which MAUI this runner actually builds against is not visible in the
        # csproj: it references $(MauiVersion), which comes from whatever
        # workload the SDK selected by dotnet-version above installed. More
        # than one iOS layout and animation bug this app has run into is
        # version-specific - dotnet/maui#33934 among them - so print it where
        # the build log will show it, rather than inferring it from a developer
        # machine's obj/ folder, which can be several versions behind.
        run: |
          echo "SDK: $(dotnet --version)"
          grep -o '"Microsoft.Maui.Controls/[0-9][^"]*"' \
            BlackjackApp.Maui/obj/project.assets.json | sort -u || true

      - name: Run BlackjackApp.core unit tests
        # Cheap correctness gate before spending macOS-runner minutes on the
        # actual iOS build - fails fast if a change broke game logic.
        run: dotnet test BlackjackApp.Tests/BlackjackApp.Tests.csproj -c Release

      - name: Build for iOS Simulator (Debug)
        run: >
          dotnet build BlackjackApp.Maui/BlackjackApp.Maui.csproj
          -f net10.0-ios
          -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:BuildIpa=false

      - name: Build for iOS Simulator (Release)
        # The Debug build above is for reading logs from: it carries debug
        # metadata, runs managed code unoptimised, and is the only
        # configuration where the layout trace in OnSizeAllocated compiles in.
        # It is NOT the configuration to judge performance by - a MAUI iOS
        # Debug build is materially slower than Release at exactly the kind of
        # work dealing a hand does, and slower still when a hosted simulator
        # service is streaming it over a network. So both come out of this
        # workflow: install Release to decide whether the app is genuinely
        # wrong, install Debug when you need the log to say why.
        run: >
          dotnet build BlackjackApp.Maui/BlackjackApp.Maui.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:BuildIpa=false

      - name: Locate the Release .app bundle
        id: find-app-release
        run: |
          APP_PATH=$(find BlackjackApp.Maui/bin/Release/net10.0-ios -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No Release .app bundle found - build likely failed earlier." >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload the Release .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-Release
          path: ${{ steps.find-app-release.outputs.app_path }}
          retention-days: 14

      - name: Locate the Debug .app bundle
        id: find-app
        run: |
          APP_PATH=$(find BlackjackApp.Maui/bin/Debug/net10.0-ios -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found - build likely failed earlier." >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload the Debug .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-Debug
          path: ${{ steps.find-app.outputs.app_path }}
          retention-days: 14

      - name: Install idb (iOS Simulator UI automation)
        # idb (facebook/idb) drives the simulator the way a person would -
        # tapping specific points and hit-testing what's there - which is
        # what turns the boot-and-screenshot step below into an actual
        # regression test for the Play freeze instead of a boot check.
        #
        # Recent Homebrew versions refuse to load a formula from a
        # third-party tap (like this one) until it's explicitly trusted -
        # `brew install facebook/fb/idb` alone taps it automatically, then
        # fails right after with "Refusing to load formula ... from
        # untrusted tap". Tap it first so there's something to trust, then
        # trust it. The whole-tap form is tried first; the error message's
        # own suggested per-formula form (naming the underlying formula,
        # idb-cli, not the idb alias) is the fallback, since a per-formula
        # `--formula` trust has been reported broken in some Homebrew
        # versions.
        run: |
          brew tap facebook/fb
          brew trust facebook/fb || brew trust --formula facebook/fb/idb-cli || \
            echo "::warning::brew trust failed via both known forms - the install below may still fail"
          brew install facebook/fb/idb

      - name: Boot a simulator and install the Debug build, then tap through Play
        # The runner has no display and no human at the keyboard, but idb
        # (installed above) can synthesize the same taps a person would -
        # see the "Automated tap-through" comment below for what this
        # actually drives the app through and why.
        run: |
          BUNDLE_ID="com.companyname.blackjackapp.maui"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_ENV"

          RUNTIME=$(xcrun simctl list runtimes ios --json | python3 -c "import json,sys; runtimes=json.load(sys.stdin)['runtimes']; print(runtimes[-1]['identifier'])")
          echo "Using runtime: $RUNTIME"

          DEVICE_ID=$(xcrun simctl create "CI-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          echo "device_id=$DEVICE_ID" >> "$GITHUB_ENV"

          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          xcrun simctl install "$DEVICE_ID" "${{ steps.find-app.outputs.app_path }}"

          # Turn on UIKit's OWN layout feedback loop detector before launching.
          # The last run's log showed UIKit looking this key up and finding
          # nothing, which means the detector was simply switched off. With a
          # threshold set, UIKit reports a view whose layout keeps re-entering
          # rather than leaving us to infer it from a frozen screen - and
          # crucially it answers that question whether or not the app's own
          # logging is working.
          xcrun simctl spawn "$DEVICE_ID" defaults write "$BUNDLE_ID" \
            UIViewLayoutFeedbackLoopDebuggingThreshold 100 || true

          mkdir -p simulator-logs

          # Two logs, because they carry different things. This one is os_log:
          # UIKit, CoreAnimation, crashes, the feedback-loop detector above.
          xcrun simctl spawn "$DEVICE_ID" log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "BlackjackApp"' \
            > simulator-logs/app-oslog.log 2>&1 &
          LOG_PID=$!

          # And this one is the app's own stdout, where its [table] trace goes.
          # The os_log stream does NOT carry it: .NET's Console and Debug output
          # do not reach os_log on iOS, which is why a previous run captured a
          # launch with not one line of the app's own logging in it. That
          # silence looked like evidence about the app; it was only evidence
          # about the logging.
          xcrun simctl launch --console-pty "$DEVICE_ID" "$BUNDLE_ID" \
            > simulator-logs/app-stdout.log 2>&1 &
          APP_PID=$!

          # --console-pty is the part most likely to misbehave on a headless
          # runner, and it is not worth losing the run over, so fall back to a
          # plain launch if the app is not actually up.
          sleep 5
          if ! xcrun simctl spawn "$DEVICE_ID" launchctl list 2>/dev/null | grep -q blackjackapp; then
            echo "::warning::--console-pty did not start the app; falling back to a plain launch (no stdout capture)."
            kill "$APP_PID" 2>/dev/null || true
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          fi

          # Let the start-menu screen (and its daily-reward popup, if one's
          # due) finish rendering before driving any taps.
          sleep 8

          # --- Automated tap-through: Play -> mode picker -> Play ---
          #
          # This is the sequence that's been reported to freeze on Appetize
          # (StartGameWith in GameMenuPage.xaml.cs): press Play on the start
          # menu, then Play again on the RulesPage mode picker. No earlier
          # version of this workflow ever pressed anything - it booted the
          # app and left it on the start menu - so it could never have
          # caught this. Doing the same two taps here, in the one
          # environment this project already fully controls and logs,
          # means every push answers the "does it still freeze" question
          # itself instead of waiting on a manual Appetize pass.
          #
          # idb's own accessibility-tree dump (`ui describe-all`) is known
          # broken on iOS 26.x simulators as of this writing - it reports
          # only the root application node back. Single-point hit-testing
          # (`ui describe-point`) is reported to still work, so element
          # lookup below is a plain vertical scan at a fixed x: probe a
          # column of points down the screen and tap the first one whose
          # accessibility label matches. Slower than reading one
          # accessibility tree, but it doesn't depend on the part that's
          # broken.
          mkdir -p simulator-screenshots
          xcrun simctl io "$DEVICE_ID" screenshot simulator-screenshots/01-start-menu.png || true

          idb list-targets || echo "::warning::idb list-targets failed - idb may not see this simulator"

          # tap_label LABEL X Y_START Y_END Y_STEP - scans (X, y) for y in
          # [Y_START, Y_END] stepping by Y_STEP, taps the first point whose
          # accessibility label is EXACTLY LABEL, records where in FOUND_Y,
          # and fails if none matched.
          #
          # Exact and case-sensitive on purpose. A loose "contains play"
          # match hits the wrong things first: the start menu's "Currently
          # playing: ..." caption sits above the PLAY button, and RulesPage
          # opens with "How to Play" and "...hit Play to start." A scan that
          # taps those instead of the buttons does nothing, and the run can
          # still come out green without the second Play ever being pressed.
          # Both buttons' text is the literal "PLAY", so matching the quoted
          # JSON value "PLAY" picks out the buttons and nothing else.
          FOUND_Y=""
          tap_label() {
            local label="$1" x="$2" y_start="$3" y_end="$4" y_step="$5"
            local y hit
            FOUND_Y=""
            for y in $(seq "$y_start" "$y_step" "$y_end"); do
              hit=$(idb --udid "$DEVICE_ID" ui describe-point "$x" "$y" 2>&1) || true
              if echo "$hit" | grep -q "\"$label\""; then
                echo "Found '$label' at ($x, $y): $hit"
                FOUND_Y="$y"
                idb --udid "$DEVICE_ID" ui tap "$x" "$y" || true
                return 0
              fi
            done
            echo "::error::Never found a point labelled '$label' scanning x=$x, y=$y_start..$y_end"
            return 1
          }

          AUTOMATION_OK=1

          echo "--- Start menu: looking for PLAY ---"
          if tap_label "PLAY" 196 80 820 20; then
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot simulator-screenshots/02-after-start-menu-play.png || true

            # The start menu's PLAY should be gone now, covered by RulesPage.
            # If the same point still reports PLAY, the tap didn't navigate,
            # and nothing after this would be testing what it claims to.
            if idb --udid "$DEVICE_ID" ui describe-point 196 "$FOUND_Y" 2>&1 | grep -q '"PLAY"'; then
              echo "::error::Still on the start menu after tapping PLAY - the tap didn't open the mode picker."
              AUTOMATION_OK=0
            fi

            # RulesPage's rule text can be tall enough to push its own Play
            # button below the fold, unlike the start menu's fixed short
            # button list - scroll it fully into view first. Over-scrolling
            # just settles at the bottom of the ScrollView, so there's no
            # need to know the exact content height to do this safely.
            idb --udid "$DEVICE_ID" ui swipe 196 700 196 100 || true
            idb --udid "$DEVICE_ID" ui swipe 196 700 196 100 || true
            sleep 1
            xcrun simctl io "$DEVICE_ID" screenshot simulator-screenshots/03-rules-scrolled.png || true

            echo "--- Rules page: looking for PLAY ---"
            # RulesPage's Play button shares its row with a narrower Close
            # button to its right (Grid ColumnDefinitions="*,Auto"), so it
            # isn't centered the way the start menu's full-width button is
            # - x=100 stays safely inside Play's column either way.
            if tap_label "PLAY" 100 80 820 20; then
              sleep 5
              xcrun simctl io "$DEVICE_ID" screenshot simulator-screenshots/04-after-rules-play.png || true

              # A real hang leaves the process running but unresponsive to
              # hit-testing, unlike a clean transition or a crash - so this
              # confirms the UI is still answering at all, not just that
              # the app didn't outright die.
              # Two separate questions. Does the UI answer at all? A hung
              # main thread can't answer a hit-test, so a timeout here is the
              # freeze. And if it answers, is Rules' PLAY gone from the point
              # we tapped? If it's still there, the game never opened - a
              # quiet failure that "the app still responds" alone would miss.
              echo "--- Checking the game actually opened after the second Play ---"
              RULES_Y="$FOUND_Y"
              if AFTER=$(timeout 15 idb --udid "$DEVICE_ID" ui describe-point 100 "$RULES_Y" 2>&1); then
                echo "Hit-test after second Play: $AFTER"
                if echo "$AFTER" | grep -q '"PLAY"'; then
                  echo "::error::UI is responsive but still on the mode picker - Play didn't start the game."
                  AUTOMATION_OK=0
                else
                  echo "Mode picker is gone and the UI responds - the game opened, no freeze."
                fi
              else
                echo "::error::UI did not respond within 15s after the second Play - this is the freeze."
                AUTOMATION_OK=0
              fi
            else
              echo "::error::Could not find Play on the Rules page - see 03-rules-scrolled.png"
              AUTOMATION_OK=0
            fi
          else
            echo "::error::Could not find Play on the start menu - see 01-start-menu.png"
            AUTOMATION_OK=0
          fi

          xcrun simctl io "$DEVICE_ID" screenshot simulator-screenshots/05-final-state.png || true

          kill "$LOG_PID" "$APP_PID" 2>/dev/null || true

          # Fail the step (red X, easy to spot in the Actions run) exactly
          # when the tap-through didn't complete cleanly - a missing button
          # or an unresponsive UI. Screenshots and logs are already written
          # above and the later upload steps run regardless (if: always()),
          # so failing here loses no diagnostic evidence.
          if [ "$AUTOMATION_OK" -ne 1 ]; then
            echo "::error::Automated Play tap-through did not complete cleanly - see the screenshots and logs artifacts."
            exit 1
          fi

      - name: Screenshot the running app (post-kill sanity check)
        if: always()
        run: |
          mkdir -p simulator-screenshots
          xcrun simctl io "$device_id" screenshot simulator-screenshots/06-post-kill.png || true

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-Screenshot
          path: simulator-screenshots/
          retention-days: 14

      - name: Upload the simulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-Log
          path: simulator-logs/
          retention-days: 14

      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "$device_id" || true

# --- Once you have an Apple Developer Program account ($99/year) ---
# A real device build (or a TestFlight upload) needs code signing, which
# needs secrets this workflow doesn't have yet:
#   1. Export your Distribution/Development certificate as a .p12 file.
#   2. Create a provisioning profile for this app's bundle ID in the
#      Apple Developer portal.
#   3. Base64-encode both and store them as encrypted GitHub Actions
#      secrets (Settings -> Secrets and variables -> Actions), along with
#      the .p12's password.
#   4. Add steps here to import the certificate into a temporary keychain
#      and install the provisioning profile before the build step, then
#      change RuntimeIdentifier to ios-arm64 and set the signing
#      properties (CodesignKey, CodesignProvision, ArchiveOnBuild=true,
#      BuildIpa=true) so the build produces a signed .ipa instead.
# Ask for help wiring this up once enrollment goes through - it's a
# bigger step than the simulator build above and worth doing carefully.
