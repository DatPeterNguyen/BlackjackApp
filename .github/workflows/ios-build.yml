# iOS: build the app for the iOS Simulator, package it for Appetize, and
# play through it automatically.
#
# Three jobs, each depending on the one before:
#
#   1. unit-tests   Core game-logic tests, on Linux (cheap, fast). Nothing
#                   else runs if the rules themselves are broken.
#   2. build        Three simulator builds on a Mac:
#                     debug           most logging, slowest
#                     release         what a player would actually run
#                     release-no-ads  Release with the AdMob SDK never
#                                     touched (see the Ads property in the
#                                     csproj) - if Play works here and
#                                     freezes in "release", the ad SDK is
#                                     the cause
#                   Each is uploaded as its own artifact, zipped the way
#                   Appetize wants: download it, unzip once, upload the
#                   BlackjackApp-ios-simulator-<name>.zip inside to Appetize.
#                   Build warnings and full MSBuild logs are uploaded too.
#   3. smoke-test   Installs each build on a simulator and runs
#                   .maestro/smoke.yaml: start menu -> Play -> mode picker ->
#                   Play -> table -> a full round -> Exit to Menu. Allowed to
#                   fail without failing the run, so the builds above are
#                   always usable even while the automation is being
#                   worked on - its results are in the run's summary.
#
# Everything is simulator-only and unsigned: no Apple Developer account is
# needed, and nothing here can go on a physical iPhone or the App Store
# (see the note at the bottom for what that takes).

name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'BlackjackApp.Maui/**'
      - 'BlackjackApp.core/**'
      - 'BlackjackApp.Tests/**'
      - '.maestro/**'
      - '.github/scripts/*ios*'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BlackjackApp.Maui/**'
      - 'BlackjackApp.core/**'
      - 'BlackjackApp.Tests/**'
      - '.maestro/**'
      - '.github/scripts/*ios*'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch: {}

# A newer push to the same branch cancels the run still going for the old
# one - macOS runner minutes are the expensive kind.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BUNDLE_ID: com.companyname.blackjackapp.maui
  # This project's .NET for iOS workload needs EXACTLY this Xcode - older and
  # newer both fail the build (https://aka.ms/xcode-requirement). If a
  # workload update moves the requirement, this is the line to change.
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  unit-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: >
          dotnet test BlackjackApp.Tests/BlackjackApp.Tests.csproj -c Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory test-results

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7

  build:
    name: Build iOS Simulator apps
    needs: unit-tests
    # macos-26 is the image that ships Xcode 26.6.
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP isn't on this runner. Xcodes that are:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install the MAUI workload
        run: dotnet workload restore BlackjackApp.Maui/BlackjackApp.Maui.csproj

      - name: Restore packages
        run: dotnet restore BlackjackApp.Maui/BlackjackApp.Maui.csproj

      - name: Record the toolchain
        # The MAUI version here comes from whichever workload the SDK picked,
        # not from the csproj, and it isn't necessarily the one on the dev
        # machine - several of the iOS bugs this app has hit are fixed or
        # introduced in specific MAUI releases. So it goes in the summary.
        run: |
          MAUI=$( (grep -o '"Microsoft.Maui.Controls/[0-9][^"]*"' BlackjackApp.Maui/obj/project.assets.json || true) \
                 | head -1 | tr -d '"' | cut -d/ -f2)
          ADMOB=$( (grep -o '"Plugin.MauiMTAdmob/[0-9][^"]*"' BlackjackApp.Maui/obj/project.assets.json || true) \
                 | head -1 | tr -d '"' | cut -d/ -f2)
          {
            echo "### Toolchain"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Xcode | $(xcodebuild -version | head -1 | cut -d' ' -f2) |"
            echo "| .NET SDK | $(dotnet --version) |"
            echo "| MAUI (Microsoft.Maui.Controls) | ${MAUI:-unknown} |"
            echo "| Plugin.MauiMTAdmob | ${ADMOB:-unknown} |"
            echo
            echo "### Builds"
            echo
            echo "| Build | Configuration | Architectures | Min iOS | Size | Warnings | Most common warnings |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          dotnet workload list

      - name: Build debug
        run: bash .github/scripts/build-ios-sim.sh Debug debug

      - name: Build release
        run: bash .github/scripts/build-ios-sim.sh Release release

      - name: Build release-no-ads
        # --no-incremental: this shares its output folder with the release
        # build above, and a switched-off define must not be able to ride
        # along on anything left over from it.
        run: bash .github/scripts/build-ios-sim.sh Release release-no-ads -p:Ads=false --no-incremental

      - name: Upload debug app
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-debug
          path: dist/BlackjackApp-ios-simulator-debug.zip
          retention-days: 14

      - name: Upload release app
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-release
          path: dist/BlackjackApp-ios-simulator-release.zip
          retention-days: 14

      - name: Upload release-no-ads app
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-release-no-ads
          path: dist/BlackjackApp-ios-simulator-release-no-ads.zip
          retention-days: 14

      - name: Upload build logs
        # Warnings for every build, plus the full binary logs - open a
        # .binlog in MSBuild Structured Log Viewer to see exactly what the
        # build did and why.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Build-Logs
          path: logs/
          retention-days: 14

  smoke-test:
    name: Smoke test in the simulator
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    # The builds are the deliverable; this job failing shows as a red job
    # and a table in the summary, but doesn't fail the run.
    continue-on-error: true
    env:
      # Maestro's iOS driver can take a while to come up on a cold runner.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          pattern: BlackjackApp-iOS-Simulator-*
          path: apps
          merge-multiple: true

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot a simulator
        # Exactly one booted simulator, so Maestro has no choice to make
        # about which device to drive.
        run: |
          RUNTIME=$(xcrun simctl list runtimes ios --json \
            | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable')]; print(r[-1]['identifier'])")
          echo "Runtime: $RUNTIME"
          DEVICE_ID=$(xcrun simctl create "Smoke-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b > /dev/null
          maestro --version

      - name: Run the smoke test on each build
        run: bash .github/scripts/smoke-test-ios.sh apps

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Smoke-Test-Results
          path: smoke-results/
          retention-days: 14

      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "$DEVICE_ID" || true

# --- Real iPhones, TestFlight and the App Store ---
# All of those need an Apple Developer Program membership ($99/year) and
# code signing, which this workflow doesn't have:
#   1. Create a distribution certificate and an App Store provisioning
#      profile for a real bundle ID (not com.companyname...) in the Apple
#      Developer portal.
#   2. Base64-encode the certificate (.p12) and profile and store them, with
#      the .p12's password, as GitHub Actions secrets.
#   3. Add a job that imports them into a temporary keychain, builds with
#      RuntimeIdentifier=ios-arm64, ArchiveOnBuild=true, BuildIpa=true,
#      CodesignKey and CodesignProvision, and uploads the .ipa to App Store
#      Connect with an App Store Connect API key.
