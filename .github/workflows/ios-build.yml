# Builds the iOS target on a macOS GitHub-hosted runner, since MAUI iOS
# builds require Xcode and can't happen on the Windows dev machine this
# project otherwise lives on. No Apple Developer account yet, so this
# builds unsigned, for the iOS Simulator only - not something you can
# install on a physical device or submit to TestFlight/the App Store.
# Once you enroll in the Apple Developer Program, this can be extended
# with a signing certificate/provisioning profile to produce a real
# device build (see the comment at the bottom of this file).
name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'BlackjackApp.Maui/**'
      - 'BlackjackApp.core/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BlackjackApp.Maui/**'
      - 'BlackjackApp.core/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch: {}

jobs:
  build-ios-simulator:
    # macOS runners are the only GitHub-hosted option with Xcode, and cost
    # 10x the CI minutes of a Linux runner - the path filters above keep
    # this from firing on every unrelated commit.
    #
    # This project's .NET for iOS workload (26.5.10318) needs EXACTLY
    # Xcode 26.6 - not "at least", older or newer both fail the same way,
    # and Microsoft doesn't provide an MSBuild property to relax that
    # check (see https://aka.ms/xcode-requirement). xcode-27 only bundles
    # Xcode 27.0 beta, which is too new; macos-26 bundles Xcode 26.6
    # directly (as its default, in fact) alongside several older ones, so
    # that's the one to use. If a future dotnet workload update bumps the
    # required Xcode version, the "Select Xcode 26.6" step below is the
    # one to update alongside it.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        # Exact version, not "latest" - see the runs-on comment above for
        # why. Fails loudly and lists what IS on the runner if 26.6 isn't
        # there, rather than silently falling back to some other version
        # that would just fail later with a more confusing MSBuild error.
        run: |
          REQUIRED_XCODE="/Applications/Xcode_26.6.app"
          if [ ! -d "$REQUIRED_XCODE" ]; then
            echo "::error::$REQUIRED_XCODE not found on this runner. Available Xcode installs:" >&2
            ls -d /Applications/Xcode*.app 2>/dev/null >&2
            exit 1
          fi
          sudo xcode-select -s "$REQUIRED_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore MAUI workloads
        run: dotnet workload restore BlackjackApp.Maui/BlackjackApp.Maui.csproj

      - name: Restore NuGet dependencies
        # dotnet restore has no -f/--framework shorthand the way build/test
        # do - passing one gets parsed as a second project path instead
        # ("Only one project can be specified"). Restoring without it just
        # restores every applicable TargetFramework for this OS (android,
        # ios, maccatalyst on a Mac runner), which is what the already-run
        # workload restore installed workloads for anyway.
        run: dotnet restore BlackjackApp.Maui/BlackjackApp.Maui.csproj

      - name: Report the resolved MAUI version
        # Which MAUI this runner actually builds against is not visible in the
        # csproj: it references $(MauiVersion), which comes from whatever
        # workload the SDK selected by dotnet-version above installed. More
        # than one iOS layout and animation bug this app has run into is
        # version-specific - dotnet/maui#33934 among them - so print it where
        # the build log will show it, rather than inferring it from a developer
        # machine's obj/ folder, which can be several versions behind.
        run: |
          echo "SDK: $(dotnet --version)"
          grep -o '"Microsoft.Maui.Controls/[0-9][^"]*"' \
            BlackjackApp.Maui/obj/project.assets.json | sort -u || true

      - name: Run BlackjackApp.core unit tests
        # Cheap correctness gate before spending macOS-runner minutes on the
        # actual iOS build - fails fast if a change broke game logic.
        run: dotnet test BlackjackApp.Tests/BlackjackApp.Tests.csproj -c Release

      - name: Build for iOS Simulator (Debug)
        run: >
          dotnet build BlackjackApp.Maui/BlackjackApp.Maui.csproj
          -f net10.0-ios
          -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:BuildIpa=false

      - name: Build for iOS Simulator (Release)
        # The Debug build above is for reading logs from: it carries debug
        # metadata, runs managed code unoptimised, and is the only
        # configuration where the layout trace in OnSizeAllocated compiles in.
        # It is NOT the configuration to judge performance by - a MAUI iOS
        # Debug build is materially slower than Release at exactly the kind of
        # work dealing a hand does, and slower still when a hosted simulator
        # service is streaming it over a network. So both come out of this
        # workflow: install Release to decide whether the app is genuinely
        # wrong, install Debug when you need the log to say why.
        run: >
          dotnet build BlackjackApp.Maui/BlackjackApp.Maui.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:BuildIpa=false

      - name: Locate the Release .app bundle
        id: find-app-release
        run: |
          APP_PATH=$(find BlackjackApp.Maui/bin/Release/net10.0-ios -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No Release .app bundle found - build likely failed earlier." >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload the Release .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-Release
          path: ${{ steps.find-app-release.outputs.app_path }}
          retention-days: 14

      - name: Locate the Debug .app bundle
        id: find-app
        run: |
          APP_PATH=$(find BlackjackApp.Maui/bin/Debug/net10.0-ios -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found - build likely failed earlier." >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload the Debug .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-Debug
          path: ${{ steps.find-app.outputs.app_path }}
          retention-days: 14

      - name: Boot a simulator and install the Debug build
        # The runner has no display and this workflow has no human at the
        # keyboard, so there's no way to actually tap around the app from
        # here - what this CAN prove, headlessly, is that it genuinely
        # boots and runs in a real iOS Simulator rather than just compiling.
        # The screenshot below is the evidence of that.
        run: |
          BUNDLE_ID="com.companyname.blackjackapp.maui"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_ENV"

          RUNTIME=$(xcrun simctl list runtimes ios --json | python3 -c "import json,sys; runtimes=json.load(sys.stdin)['runtimes']; print(runtimes[-1]['identifier'])")
          echo "Using runtime: $RUNTIME"

          DEVICE_ID=$(xcrun simctl create "CI-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          echo "device_id=$DEVICE_ID" >> "$GITHUB_ENV"

          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          xcrun simctl install "$DEVICE_ID" "${{ steps.find-app.outputs.app_path }}"

          # Turn on UIKit's OWN layout feedback loop detector before launching.
          # The last run's log showed UIKit looking this key up and finding
          # nothing, which means the detector was simply switched off. With a
          # threshold set, UIKit reports a view whose layout keeps re-entering
          # rather than leaving us to infer it from a frozen screen - and
          # crucially it answers that question whether or not the app's own
          # logging is working.
          xcrun simctl spawn "$DEVICE_ID" defaults write "$BUNDLE_ID" \
            UIViewLayoutFeedbackLoopDebuggingThreshold 100 || true

          mkdir -p simulator-logs

          # Two logs, because they carry different things. This one is os_log:
          # UIKit, CoreAnimation, crashes, the feedback-loop detector above.
          xcrun simctl spawn "$DEVICE_ID" log stream --level debug --style compact \
            --predicate 'processImagePath CONTAINS "BlackjackApp"' \
            > simulator-logs/app-oslog.log 2>&1 &
          LOG_PID=$!

          # And this one is the app's own stdout, where its [table] trace goes.
          # The os_log stream does NOT carry it: .NET's Console and Debug output
          # do not reach os_log on iOS, which is why a previous run captured a
          # launch with not one line of the app's own logging in it. That
          # silence looked like evidence about the app; it was only evidence
          # about the logging.
          xcrun simctl launch --console-pty "$DEVICE_ID" "$BUNDLE_ID" \
            > simulator-logs/app-stdout.log 2>&1 &
          APP_PID=$!

          # --console-pty is the part most likely to misbehave on a headless
          # runner, and it is not worth losing the run over, so fall back to a
          # plain launch if the app is not actually up.
          sleep 5
          if ! xcrun simctl spawn "$DEVICE_ID" launchctl list 2>/dev/null | grep -q blackjackapp; then
            echo "::warning::--console-pty did not start the app; falling back to a plain launch (no stdout capture)."
            kill "$APP_PID" 2>/dev/null || true
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          fi

          # Let the start-menu screen (and its daily-reward popup, if one's
          # due) finish rendering before the screenshot below.
          sleep 8

          kill "$LOG_PID" "$APP_PID" 2>/dev/null || true

      - name: Screenshot the running app
        run: |
          mkdir -p simulator-screenshots
          xcrun simctl io "$device_id" screenshot simulator-screenshots/01-launch.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-Screenshot
          path: simulator-screenshots/
          retention-days: 14

      - name: Upload the simulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackjackApp-iOS-Simulator-Log
          path: simulator-logs/
          retention-days: 14

      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "$device_id" || true

# --- Once you have an Apple Developer Program account ($99/year) ---
# A real device build (or a TestFlight upload) needs code signing, which
# needs secrets this workflow doesn't have yet:
#   1. Export your Distribution/Development certificate as a .p12 file.
#   2. Create a provisioning profile for this app's bundle ID in the
#      Apple Developer portal.
#   3. Base64-encode both and store them as encrypted GitHub Actions
#      secrets (Settings -> Secrets and variables -> Actions), along with
#      the .p12's password.
#   4. Add steps here to import the certificate into a temporary keychain
#      and install the provisioning profile before the build step, then
#      change RuntimeIdentifier to ios-arm64 and set the signing
#      properties (CodesignKey, CodesignProvision, ArchiveOnBuild=true,
#      BuildIpa=true) so the build produces a signed .ipa instead.
# Ask for help wiring this up once enrollment goes through - it's a
# bigger step than the simulator build above and worth doing carefully.
